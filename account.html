
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA | Accounts</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #151515;
      padding: 35px;
      border: 1px solid #333;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
      letter-spacing: 4px;
      color: #d6b36a;
    }

    p {
      text-align: center;
      color: #aaa;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #444;
      border-radius: 6px;
      background: #222;
      color: white;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #d6b36a;
      color: #111;
    }

    .secondary {
      background: #333;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      overflow-wrap: break-word;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #d6b36a;
      text-decoration: none;
    }

    #accountInfo {
      text-align: center;
      overflow-wrap: break-word;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>NEXORA</h1>
    <p>Join the platform. Share ideas. Discover possibilities.</p>

    <div id="authForms">
      <input
        type="text"
        id="displayName"
        placeholder="Display name (for sign up)"
      >

      <input
        type="email"
        id="email"
        placeholder="Email address"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button class="primary" id="signupBtn">
        Create Account
      </button>

      <button class="secondary" id="loginBtn">
        Log In
      </button>
      <p>
  <a href="#" id="forgotPassword">Forgot Password?</a>
</p>
    </div>

    <div id="accountInfo" hidden>
      <p id="userEmail"></p>
      <button class="secondary" id="logoutBtn">
        Log Out
      </button>
    </div>

    <div id="message"></div>

    <a href="index.html" class="back">← Back to Home</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // REPLACE THESE TWO VALUES WITH YOUR SUPABASE DETAILS
   const SUPABASE_URL = "https://pinavuqlsojjcjlzqpki.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Yb3ECpWEqzZRAJFlAUYP5Q_MqBMooOj";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const message = document.getElementById("message");
    const authForms = document.getElementById("authForms");
    const accountInfo = document.getElementById("accountInfo");
    const userEmail = document.getElementById("userEmail");

    function showMessage(text, color = "#d6b36a") {
      message.textContent = text;
      message.style.color = color;
    }

    function showLoggedInUser(user) {
      authForms.hidden = true;
      accountInfo.hidden = false;
      userEmail.textContent = "Logged in as: " + user.email;
    }

    function showLoggedOut() {
      authForms.hidden = false;
      accountInfo.hidden = true;
      userEmail.textContent = "";
    }

    document.getElementById("signupBtn").addEventListener("click", async () => {
      const name = document.getElementById("displayName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!name || !email || !password) {
        showMessage("Please fill in all fields.", "#ff8080");
        return;
      }

      showMessage("Creating account...");

      const { data, error } = await client.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            display_name: name
          }
        }
      });

      if (error) {
        showMessage(error.message, "#ff8080");
        return;
      }

      if (data.user && !data.session) {
        showMessage("Account created! Check your email for confirmation.");
      } else if (data.user) {
        showLoggedInUser(data.user);
        showMessage("Account created successfully!");
      }
    });

 document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Enter your email and password.", "#ff8080");
    return;
  }

  showMessage("Logging in...");

  const { data, error } = await client.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    showMessage(error.message, "#ff8080");
    return;
  }

  showLoggedInUser(data.user);
  showMessage("Welcome back!");
});
