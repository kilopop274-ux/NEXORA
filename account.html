
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA | Member Access</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#10121a;color:#f4f2ed;font-family:Arial,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
}
header{padding:22px 8%;border-bottom:1px solid #292b35}
.logo{font-size:27px;letter-spacing:4px;font-weight:bold;color:#dfbd78}
main{flex:1;display:flex;justify-content:center;align-items:center;padding:45px 20px}
.card{
  width:100%;max-width:460px;background:#191c27;
  border:1px solid #343746;border-radius:10px;padding:35px;
}
h1{text-align:center;font-size:28px;margin-bottom:10px}
.intro{text-align:center;color:#aeb0bb;margin-bottom:25px}
.tabs{display:flex;margin-bottom:25px;border-bottom:1px solid #343746}
.tab{
  flex:1;text-align:center;padding:12px;cursor:pointer;
  color:#aeb0bb;border-bottom:2px solid transparent;
}
.tab.active{color:#dfbd78;border-color:#dfbd78}
label{display:block;margin:17px 0 8px;font-size:14px}
input{
  width:100%;padding:13px;border:1px solid #444653;
  border-radius:5px;background:#20232f;color:white;
}
button{
  width:100%;padding:14px;border:0;border-radius:5px;
  background:#dfbd78;color:#10121a;font-weight:bold;
  margin-top:22px;cursor:pointer;
}
button:hover{opacity:.9}
.note{font-size:12px;color:#858895;text-align:center;margin-top:18px}
.hidden{display:none}
footer{text-align:center;padding:25px;color:#858895;font-size:13px}
</style>
</head>
<body>

<header>
  <div class="logo">NEXORA</div>
</header>

<main>
<div class="card">
<h1>Welcome to NEXORA</h1>
<p class="intro">A world of ideas, knowledge and possibilities.</p>

<div class="tabs">
  <div class="tab active" id="loginTab">Log In</div>
  <div class="tab" id="signupTab">Sign Up</div>
</div>

<form id="loginForm">
  <label for="loginEmail">Email address</label>
  <input id="loginEmail" type="email" placeholder="Your email address" required>

  <label for="loginPassword">Password</label>
  <input id="loginPassword" type="password" placeholder="Your password" required>

  <button type="submit">Log In</button>
</form>

<form id="signupForm" class="hidden">
  <label for="displayName">Display name</label>
  <input id="displayName" type="text" maxlength="60" placeholder="Your display name" required>

  <label for="signupEmail">Email address</label>
  <input id="signupEmail" type="email" placeholder="Your email address" required>

  <label for="signupPassword">Password</label>
  <input id="signupPassword" type="password" minlength="8" placeholder="At least 8 characters" required>

  <button type="submit">Create Account</button>
</form>

<p id="message" class="note">
  NEXORA account testing. Do not use real accounts until the system has been reviewed.
</p>
</div>
</main>

<footer>© 2026 NEXORA · Ideas. Knowledge. Possibilities.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://pinavuqlsojjcjlzqpki.supabase.c";
const SUPABASE_KEY = "sb_publishable_Yb3ECpWEqzZRAJFlAUYP5Q_MqBMooOj";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");
const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");
const message = document.getElementById("message");

loginTab.onclick = function(){
  loginTab.classList.add("active");
  signupTab.classList.remove("active");
  loginForm.classList.remove("hidden");
  signupForm.classList.add("hidden");
  message.textContent = "";
};

signupTab.onclick = function(){
  signupTab.classList.add("active");
  loginTab.classList.remove("active");
  signupForm.classList.remove("hidden");
  loginForm.classList.add("hidden");
  message.textContent = "";
};

loginForm.onsubmit = async function(event){
  event.preventDefault();
  message.textContent = "Signing in...";

  const {error} = await client.auth.signInWithPassword({
    email: document.getElementById("loginEmail").value,
    password: document.getElementById("loginPassword").value
  });

  message.textContent = error ? error.message : "Signed in successfully!";
};

signupForm.onsubmit = async function(event){
  event.preventDefault();
  message.textContent = "Creating account...";

  const {error} = await client.auth.signUp({
    email: document.getElementById("signupEmail").value,
    password: document.getElementById("signupPassword").value,
    options: {
      data: {
        display_name: document.getElementById("displayName").value.trim()
      }
    }
  });

  message.textContent = error
    ? error.message
    : "Registration request received. If email confirmation is enabled, check your inbox to confirm.";
};
</script>

</body>
</html>
